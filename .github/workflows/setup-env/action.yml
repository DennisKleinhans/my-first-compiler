name: 'Setup Environment'
description: 'Installs Scala and sets up dependencies'
runs:
  using: 'composite'
  steps:
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Setup SBT
      uses: sbt/setup-sbt@v1
    - name: Setup LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: 15
