name: Scala CI Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Setup SBT
      uses: sbt/setup-sbt@v1
    - name: Setup LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: 15
    - name: Run tests
      run: sbt test
